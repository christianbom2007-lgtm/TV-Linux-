set default=0
set timeout=8
menuentry 'Lichtung TV installieren (automatisch)' {
    set background_color=black
    linux    /install.amd/vmlinuz auto=true priority=high preseed/file=/cdrom/preseed.cfg debian-installer/locale=de_DE.UTF-8 debian-installer/language=de debian-installer/country=DE keyboard-configuration/xkb-keymap=de netcfg/get_hostname=lichtung netcfg/get_domain= --- quiet
    initrd   /install.amd/initrd.gz
}
