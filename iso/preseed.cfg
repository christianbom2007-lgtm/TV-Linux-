#### Lichtung TV – automatische Debian-13-Installation
# Diese Antwortdatei beantwortet die Fragen des Debian-Installers.
# Gefragt wird nur noch: WLAN (falls kein Kabel) und die Sicherheitsabfrage
# vor dem Löschen der Festplatte.

### Sprache & Tastatur (zusätzlich auch über das Bootmenü gesetzt)
d-i debian-installer/locale string de_DE.UTF-8
d-i debian-installer/language string de
d-i debian-installer/country string DE
d-i keyboard-configuration/xkb-keymap select de
d-i keyboard-configuration/layoutcode string de

### Netzwerk: Kabel automatisch, bei WLAN fragt der Installer nach Netz + Passwort
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string lichtung
d-i netcfg/hostname string lichtung
d-i netcfg/get_domain string
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

### Paketquelle
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/cdrom/set-first boolean false

### Benutzer: root und "chris", beide mit Passwort 123456
d-i passwd/root-login boolean true
d-i passwd/root-password password 123456
d-i passwd/root-password-again password 123456
d-i passwd/user-fullname string Christian
d-i passwd/username string chris
d-i passwd/user-password password 123456
d-i passwd/user-password-again password 123456
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

### Uhr
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Berlin
d-i clock-setup/ntp boolean true

### Festplatte: die interne Platte (nicht der USB-Stick) wird komplett genutzt.
# Die Platte wird automatisch ermittelt: erste Platte, die NICHT das Installationsmedium ist.
d-i partman/early_command string \
  MEDIA=$(mount | grep ' /cdrom ' | cut -d' ' -f1 | sed -e 's/[0-9]*$//' -e 's/p$//'); \
  for d in $(list-devices disk); do [ "$d" = "$MEDIA" ] && continue; debconf-set partman-auto/disk "$d"; break; done
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman-efi/non_efi_system boolean true
# SICHERHEITSABFRAGE: "partman/confirm" wird bewusst NICHT beantwortet.
# Der Installer fragt also einmal: "Änderungen auf die Festplatten schreiben?"
# und zeigt dabei an, welche Platte gelöscht wird.

### Softwareauswahl: nur Grundsystem (kein Desktop) – Lichtung bringt alles Weitere mit
tasksel tasksel/first multiselect standard
d-i pkgsel/include string sudo curl ca-certificates zip
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### Lichtung TV installieren (läuft im neuen System, braucht Internet)
d-i preseed/late_command string \
  cp -r /cdrom/lichtung /target/root/lichtung-tv; \
  in-target usermod -aG sudo chris; \
  in-target sh -c 'cd /root/lichtung-tv && bash install.sh > /var/log/lichtung-install.log 2>&1' || true

### Fertig: ohne Nachfrage neu starten
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean false
