# WirePlumber: HDMI-Ausgänge bevorzugen, damit der Ton automatisch
# über den Fernseher kommt, sobald das HDMI-Kabel steckt.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*[Hh][Dd][Mm][Ii].*" } ]
    actions = { update-props = { priority.session = 2000, priority.driver = 2000 } }
  }
]
