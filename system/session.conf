# Lichtung TV – Sitzungs-Einstellungen
# Nach Änderungen: Laptop neu starten (oder in Einstellungen → System → Neu starten)

# Tastaturbelegung (de = deutsch)
KEYBOARD_LAYOUT=de

# Welche Bildschirme genutzt werden:
#   last   = nur der zuletzt angeschlossene (HDMI-Fernseher)  ← empfohlen
#   extend = alle Bildschirme (Laptop + Fernseher)
OUTPUT_MODE=last

# Größe des Mauszeigers
CURSOR_SIZE=32

# Name, unter dem der Laptop beim iPhone (AirPlay / Bildschirmsynchronisierung) erscheint
AIRPLAY_NAME=Lichtung
