# ==========================================================================
#  Lichtung TV – sway als "Fernseh-Fenstermanager"
# --------------------------------------------------------------------------
#  Früher lief hier "cage" (zeigt genau EIN Programm). sway kann mehrere
#  Programme offen halten und zwischen ihnen springen – ohne sichtbare
#  Fenster, Leisten oder Rahmen. Jedes Programm hat seine eigene Ebene
#  ("Arbeitsfläche"):
#     1 = Lichtung-Startseite (Firefox im Kiosk, nur für die eigene Oberfläche)
#     2 = Brave (normaler Browser mit Tabs und Adressleiste)
#     3 = Programme (Terminal, App-Store, Retro-Spiele, eigene Apps)
#     4 = Brave-Kinofenster (z. B. YouTube ohne Leisten)
#  Die Home-Taste springt immer zurück auf Ebene 1 – die anderen Programme
#  laufen weiter, offene Tabs bleiben erhalten.
# ==========================================================================

set $ctl /opt/lichtung-tv/system/lichtung-ctl

# Tastatur, Bildschirm-Auswahl usw. (vom Installer erzeugt)
include /etc/lichtung-tv/sway-local.conf

# ---------- Aussehen: nichts außer dem Programm selbst ----------
output * bg #050706 solid_color
default_border none
default_floating_border none
gaps inner 0
gaps outer 0
titlebar_border_thickness 0
titlebar_padding 1
font pango:DejaVu Sans 1
focus_follows_mouse no
mouse_warping none
focus_on_window_activation focus
xwayland enable
# Mauszeiger nach 3 Sekunden Ruhe ausblenden
seat * hide_cursor 3000

# ---------- Welches Programm auf welche Ebene ----------
assign [app_id="^firefox"] workspace number 1
assign [app_id="^brave-browser$"] workspace number 2
assign [app_id="^brave-.+"] workspace number 4
assign [app_id="^(foot|org\.gnome\.Software|retroarch|com\.libretro\.RetroArch)$"] workspace number 3

# Spiegeln (iPhone/Android), Videos, Spiele: immer Vollbild
for_window [app_id="^(?!firefox|brave|foot|org\.gnome\.).*"] fullscreen enable
for_window [title="^UxPlay"] fullscreen enable
for_window [app_id="^scrcpy$"] fullscreen enable
# Kleine Dialoge (z. B. "Datei speichern") schwebend in der Mitte
for_window [window_role="pop-up"] floating enable
for_window [window_role="dialog"] floating enable
for_window [app_id="^xdg-desktop-portal"] floating enable

# ---------- Tasten (gelten überall, auch in Brave und Programmen) ----------
# Windows-Taste allein, Home-Taste der Fernbedienung, F1 → Lichtung-Startseite
bindsym --release Super_L exec $ctl home
bindsym --release Super_R exec $ctl home
bindsym XF86HomePage exec $ctl home
bindsym F1 exec $ctl home
bindsym Mod4+Escape exec $ctl home

# Lautstärke – direkt hier abgefangen, damit es in JEDEM Programm geht
bindsym --locked XF86AudioRaiseVolume exec $ctl key volup
bindsym --locked XF86AudioLowerVolume exec $ctl key voldown
bindsym --locked XF86AudioMute exec $ctl key mute
bindsym --locked XF86AudioMicMute exec $ctl key mute

# Schnellmenü (Ton, Abendmodus, Bildschirm aus …)
bindsym Mod4+q exec $ctl quick
bindsym XF86Tools exec $ctl quick

# Programme direkt öffnen
bindsym Mod4+b exec $ctl browser
bindsym Ctrl+Alt+t exec $ctl app terminal
bindsym Mod4+t exec $ctl app terminal

# Zwischen offenen Programmen wechseln
bindsym Mod4+Tab workspace next_on_output
bindsym Alt+Tab workspace back_and_forth
bindsym Mod4+1 workspace number 1
bindsym Mod4+2 workspace number 2
bindsym Mod4+3 workspace number 3
bindsym Mod4+4 workspace number 4

# Notfall: Konfiguration neu laden
bindsym Mod4+Shift+r reload

# ---------- Start ----------
# Dem Dienst sagen: sway läuft, Tasten kommen jetzt von hier
exec_always $ctl hello
# Lautstärke-Anzeige über allen Programmen (wob)
exec /opt/lichtung-tv/system/session-extras.sh
# Die Lichtung-Startseite
exec /opt/lichtung-tv/system/browser-loop.sh
workspace number 1
