<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Radio · Lichtung</title>
<link rel="stylesheet" href="app.css">
<style>
  /* Aufbau: links die Listen (Favoriten, Italien …), rechts die Sender als Karten,
     unten die Leiste "Läuft gerade". Alles mit Pfeiltasten bedienbar. */
  body { background: #060807; overflow: hidden; }
  .glow { position: fixed; inset: -20%; background: radial-gradient(40% 50% at 70% 30%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
          radial-gradient(35% 45% at 20% 80%, rgba(80,120,110,.18), transparent 70%); filter: blur(30px); transition: background 1s; }
  .backdrop { position: fixed; inset: 0; background-size: cover; background-position: center; filter: blur(60px) saturate(1.3); opacity: .22; transform: scale(1.2); transition: opacity 1s; }
  .wrap { position: fixed; inset: 0; display: grid; grid-template-columns: calc(40 * var(--u)) 1fr; gap: calc(4 * var(--u)); padding: calc(5 * var(--u)) calc(5 * var(--u)) calc(17 * var(--u)); }
  .side h1 { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: calc(7 * var(--u)); margin: 0 0 calc(3 * var(--u)); line-height: 1; }
  .side h1 small { display: block; font-family: var(--mono); font-style: normal; font-size: calc(1.3 * var(--u)); letter-spacing: .3em; text-transform: uppercase; color: var(--ink-3); margin-top: calc(1.2 * var(--u)); }
  .cats button { display: flex; width: 100%; gap: calc(1.6 * var(--u)); text-align: left; padding: calc(1.3 * var(--u)) calc(1.6 * var(--u)); border-radius: calc(1 * var(--u)); font-size: calc(1.9 * var(--u)); color: var(--ink-2); }
  .cats button .n { color: var(--ink-3); min-width: 2ch; }
  .cats button.sel { color: var(--accent); }
  .cats button.focused { background: var(--accent); color: #0b0d0c; }
  .cats button.focused .n { color: rgba(0,0,0,.5); }
  .search { margin-top: calc(2 * var(--u)); }
  .search input { width: 100%; box-sizing: border-box; padding: calc(1.4 * var(--u)) calc(1.8 * var(--u)); border-radius: 999px; border: 1px solid var(--line); background: var(--glass-2); color: var(--ink); font: inherit; font-size: calc(1.8 * var(--u)); }
  .search input.focused { border-color: var(--accent); outline: 2px solid var(--accent); }
  .main { overflow-y: auto; scrollbar-width: none; padding: calc(1 * var(--u)); }
  .main h2 { font-family: var(--serif); font-weight: 300; font-size: calc(3.6 * var(--u)); margin: 0 0 calc(2.4 * var(--u)); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(22 * var(--u)), 1fr)); gap: calc(2 * var(--u)); }
  .st { position: relative; display: flex; flex-direction: column; align-items: center; gap: calc(1.2 * var(--u)); padding: calc(2.2 * var(--u)) calc(1.4 * var(--u)) calc(1.8 * var(--u)); border-radius: calc(1.6 * var(--u)); background: var(--glass-2); border: 1px solid var(--line); text-align: center; transition: transform .2s var(--ease), background .2s; }
  .st .logo { width: calc(9 * var(--u)); height: calc(9 * var(--u)); border-radius: calc(1.6 * var(--u)); background: #fff center/contain no-repeat; display: grid; place-items: center; font-family: var(--serif); font-size: calc(4 * var(--u)); color: #0b0d0c; overflow: hidden; }
  .st .logo.none { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 70%, #fff), var(--accent)); }
  .st b { font-weight: 500; font-size: calc(1.8 * var(--u)); line-height: 1.2; max-height: 2.4em; overflow: hidden; }
  .st span { font-size: calc(1.15 * var(--u)); letter-spacing: .15em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .st .fav { position: absolute; top: calc(1 * var(--u)); right: calc(1.2 * var(--u)); color: var(--accent); font-size: calc(1.8 * var(--u)); }
  .st.playing { border-color: var(--accent); }
  .st.playing::after { content: '♪'; position: absolute; top: calc(1 * var(--u)); left: calc(1.2 * var(--u)); color: var(--accent); font-size: calc(1.8 * var(--u)); }
  .st.focused { background: var(--accent); color: #0b0d0c; transform: scale(1.04); }
  .st.focused span, .st.focused .fav, .st.focused::after { color: rgba(0,0,0,.6); }
  .empty { color: var(--ink-3); font-size: calc(2 * var(--u)); padding: calc(4 * var(--u)) 0; }
  .now { position: fixed; left: calc(5 * var(--u)); right: calc(5 * var(--u)); bottom: calc(4 * var(--u)); display: flex; align-items: center; gap: calc(3 * var(--u)); padding: calc(2 * var(--u)) calc(3 * var(--u)); border-radius: calc(2 * var(--u)); background: var(--glass-2); backdrop-filter: blur(18px); border: 1px solid var(--line); }
  .now .logo { width: calc(8 * var(--u)); height: calc(8 * var(--u)); border-radius: calc(1.4 * var(--u)); background: #fff center/contain no-repeat; flex: none; }
  .now .txt { flex: 1; min-width: 0; }
  .now .lbl { font-size: calc(1.15 * var(--u)); letter-spacing: .3em; text-transform: uppercase; color: var(--accent); }
  .now .nm { font-family: var(--serif); font-size: calc(3.4 * var(--u)); line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .ti { color: var(--ink-2); font-size: calc(1.7 * var(--u)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: calc(.4 * var(--u)); }
  .now .eq { display: flex; gap: 4px; align-items: flex-end; height: calc(4 * var(--u)); }
  .now .eq i { width: calc(.7 * var(--u)); background: var(--accent); border-radius: 2px; animation: eq 1s ease-in-out infinite; }
  .now .eq i:nth-child(2) { animation-delay: -.3s } .now .eq i:nth-child(3) { animation-delay: -.6s } .now .eq i:nth-child(4) { animation-delay: -.15s }
  .now.off .eq { visibility: hidden; }
  @keyframes eq { 0%, 100% { height: 20% } 50% { height: 100% } }
  .now .help { font-size: calc(1.15 * var(--u)); letter-spacing: .12em; color: var(--ink-3); text-align: right; line-height: 1.8; }
  .now button { padding: calc(1.2 * var(--u)) calc(2.4 * var(--u)); border-radius: 999px; border: 1px solid var(--line); font-size: calc(1.5 * var(--u)); letter-spacing: .15em; text-transform: uppercase; }
  .now button.focused { background: var(--accent); color: #0b0d0c; }
</style>
</head>
<body class="hide-cursor">
<div class="glow"></div>
<div class="backdrop" id="backdrop"></div>
<div class="wrap">
  <div class="side">
    <h1>Radio<small>Internetradio · radio-browser.info</small></h1>
    <div class="cats" id="cats"></div>
    <div class="search"><input id="q" data-nav type="search" placeholder="Sender suchen …"></div>
  </div>
  <div class="main" id="main"><h2 id="listTitle">…</h2><div class="grid" id="grid"></div></div>
</div>
<div class="now off" id="now">
  <div class="logo" id="nowLogo" hidden></div>
  <div class="txt"><div class="lbl" id="nowLbl">Radio ist aus</div><div class="nm" id="nowName">Sender auswählen und OK drücken</div><div class="ti" id="nowTitle"></div></div>
  <div class="eq"><i></i><i></i><i></i><i></i></div>
  <button data-nav id="stopBtn">Stopp</button>
  <div class="help">OK = abspielen · M = Favorit<br>Kanal ± = nächster Sender · Zurück = Startseite<br>Läuft weiter, wenn du zurückgehst</div>
</div>
<script src="common.js"></script>
<script>
/* Lichtung TV – Radio
 * Senderlisten kommen über den Lichtung-Dienst aus radio-browser.info.
 * Abgespielt wird NICHT hier im Browser, sondern im Dienst (mpv) – deshalb
 * läuft das Radio weiter, wenn man zur Startseite zurückgeht. */
'use strict';
const { h, $ } = L, Nav = L.Nav;
let cat = 'favoriten', items = [], status = {}, favIds = new Set(), cats = [];

/* Sender-Logo: viele Sender liefern eins; sonst der Anfangsbuchstabe */
function logoEl(st, cls = 'logo') {
  const el = h('div', { class: cls });
  if (st.logo && /^https?:/.test(st.logo)) {
    const img = new Image();
    img.onload = () => { el.style.backgroundImage = `url("${st.logo}")`; };
    img.onerror = () => { el.classList.add('none'); el.textContent = (st.name || '?')[0]; };
    img.src = st.logo;
  } else { el.classList.add('none'); el.textContent = (st.name || '?')[0]; }
  return el;
}

function paintNow() {
  const s = status.station, on = status.playing && s;
  $('#now').classList.toggle('off', !on);
  $('#nowLbl').textContent = on ? 'Läuft gerade' : 'Radio ist aus';
  $('#nowName').textContent = on ? s.name : 'Sender auswählen und OK drücken';
  $('#nowTitle').textContent = on ? (status.title || [s.country, ...(s.tags || [])].filter(Boolean).join(' · ')) : '';
  const lg = $('#nowLogo');
  lg.hidden = !(on && s.logo);
  if (on && s.logo) lg.style.backgroundImage = `url("${s.logo}")`;
  $('#backdrop').style.backgroundImage = on && s.logo ? `url("${s.logo}")` : '';
  $('#stopBtn').textContent = on ? 'Stopp' : 'Letzten Sender';
  document.querySelectorAll('.st').forEach((el) => el.classList.toggle('playing', !!on && el.dataset.id === s.id));
}

function renderCats() {
  const box = $('#cats'); box.innerHTML = '';
  [{ id: 'favoriten', title: 'Favoriten' }, ...cats].forEach((c, i) => {
    const b = h('button', { 'data-nav': true, class: c.id === cat ? 'sel' : '' }, h('span', { class: 'n' }, L.pad(i + 1)), c.title);
    b.addEventListener('click', () => load(c.id));
    box.append(b);
  });
}

async function load(c, q = '') {
  cat = c; renderCats();
  const title = q ? `Suche: ${q}` : c === 'favoriten' ? 'Favoriten' : (cats.find((x) => x.id === c) || {}).title || '';
  $('#listTitle').textContent = title;
  $('#grid').innerHTML = '';
  $('#grid').append(h('div', { class: 'empty' }, 'Lade Sender …'));
  try {
    const r = await L.api('/api/radio/search?' + new URLSearchParams({ cat: q ? '' : c, q }));
    items = r.items || [];
  } catch (e) { items = []; $('#grid').innerHTML = ''; $('#grid').append(h('div', { class: 'empty' }, 'Senderverzeichnis gerade nicht erreichbar. ' + e.message)); return; }
  renderGrid();
}

function renderGrid() {
  const g = $('#grid'); g.innerHTML = '';
  if (!items.length) {
    g.append(h('div', { class: 'empty' }, cat === 'favoriten' ? 'Noch keine Favoriten. Wähle links eine Liste, geh auf einen Sender und drück M.' : 'Keine Sender gefunden.'));
    return;
  }
  items.forEach((st) => {
    const el = h('button', { class: 'st', 'data-nav': true, 'data-id': st.id },
      logoEl(st), h('b', {}, st.name), h('span', {}, [st.country, ...(st.tags || []).slice(0, 2)].filter(Boolean).join(' · ') || 'Radio'),
      favIds.has(st.id) ? h('div', { class: 'fav' }, '★') : null);
    el.addEventListener('click', () => play(st));
    el._st = st;
    g.append(el);
  });
  paintNow();
}

async function play(st) {
  try { await L.api('/api/radio/play', 'POST', { station: st }); L.toast('▶ ' + st.name); }
  catch (e) { L.toast('Sender startet nicht: ' + e.message); }
}

async function toggleFav(st) {
  const on = !favIds.has(st.id);
  const r = await L.api('/api/radio/fav', 'POST', { station: st, on });
  favIds = new Set((r.favorites || []).map((f) => f.id));
  L.toast(on ? '★ Zu Favoriten hinzugefügt' : 'Aus Favoriten entfernt');
  const keep = Nav.current?.dataset.id;
  if (cat === 'favoriten') items = r.favorites || [];
  renderGrid();
  const again = keep && document.querySelector(`.st[data-id="${CSS.escape(keep)}"]`);
  if (again) Nav.focus(again, { instant: true }); else Nav.ensure();
}

$('#stopBtn').addEventListener('click', () => L.api('/api/radio/toggle', 'POST', {}));
$('#q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && $('#q').value.trim()) { e.stopPropagation(); load('', $('#q').value.trim()).then(() => { const f = document.querySelector('.st'); if (f) Nav.focus(f); }); }
});

function handle(k) {
  if (['up', 'down', 'left', 'right'].includes(k)) { Nav.move(k); return; }
  if (k === 'ok') return Nav.activate();
  if (k === 'menu' || k === 'm' || k === 'M') { const st = Nav.current?._st; if (st) toggleFav(st); return; }
  if (k === 'chup') return L.api('/api/radio/step', 'POST', { dir: 1 });
  if (k === 'chdown') return L.api('/api/radio/step', 'POST', { dir: -1 });
  if (k === 'play') return L.api('/api/radio/toggle', 'POST', {});
  if (k === 'back' || k === 'home' || (k === 'backspace' && !L.isTyping())) location.href = '/';
}
addEventListener('keydown', (e) => {
  const k = L.keyName(e);
  if (L.isTyping() && !['up', 'down', 'back', 'ok'].includes(k)) return;   // im Suchfeld normal tippen
  if (L.isTyping() && k === 'ok') return;
  e.preventDefault();
  handle(k);
});

L.events((ev) => {
  if (ev.type === 'radio') { status = ev; paintNow(); }
  else if (ev.type === 'volume') L.showVolume(ev);
  else if (ev.type === 'home') location.href = '/';
  else if (ev.type === 'open') location.href = ev.url;
  else if (ev.type === 'remotekey') handle({ menu: 'menu' }[ev.key] || ev.key);
});

(async function init() {
  const r = await L.api('/api/radio').catch(() => ({}));
  status = r; cats = r.categories || [];
  favIds = new Set((r.favorites || []).map((f) => f.id));
  if (r.available === false) L.toast('mpv fehlt noch – bitte Update einspielen', 6000);
  await load((r.favorites || []).length ? 'favoriten' : 'italien');
  const first = document.querySelector('.st.playing') || document.querySelector('.st') || document.querySelector('.cats button');
  Nav.focus(first, { instant: true });
  paintNow();
})();
</script>
</body>
</html>
